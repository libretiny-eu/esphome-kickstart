substitutions:
  name: kickstart-rtl8720cf
  import_url: github://libretiny-eu/esphome-kickstart/yaml/import-rtl8720cf.yaml@master

packages:
  base: !include kickstart-base.yaml
  libretiny: !include kickstart-base-libretiny.yaml

rtl87xx:
  board: generic-rtl8720cf-2mb-992k
  framework:
    version: latest
    loglevel: debug

select:
  - platform: template
    id: !extend pin
    options:
      - Select PIN
      - PIN_PA00 / TCK / UART1_RX / PWM0 / SWCLK
      - PIN_PA01 / TMS / UART1_TX / PWM1 / SWDIO
      - PIN_PA02 / TDO / UART1_RX / SPI0_CS / I2C0_SCL / PWM2
      - PIN_PA03 / TDI / UART1_TX / SPI0_SCK / I2C0_SDA / PWM3
      - PIN_PA04 / tRST / UART1_CTS / SPI0_MOSI / PWM4
      - PIN_PA07 / FCS / SPI0_CS
      - PIN_PA08 / FSCK / SPI0_SCK
      - PIN_PA09 / FD2 / SPI0_MOSI / UART0_RTS
      - PIN_PA10 / FD1 / SPI0_MISO / UART0_CTS
      - PIN_PA11 / FD0 / UART0_TX / I2C0_SCL / PWM0
      - PIN_PA12 / FD3 / UART0_RX / I2C0_SDA / PWM1
      - PIN_PA13 / UART0_RX / PWM7
      - PIN_PA14 / SD_INT / UART0_TX / PWM2
      - PIN_PA15 / SD_D2 / SPI0_CS / UART2_RX / I2C0_SCL / PWM3
      - PIN_PA16 / SD_D3 / SPI0_SCK / UART2_TX / I2C0_SDA / PWM4
      - PIN_PA17 / SD_CMD / PWM5
      - PIN_PA18 / SD_CLK / PWM6
      - PIN_PA19 / SD_D0 / SPI0_MOSI / UART2_CTS / I2C0_SCL / PWM7
      - PIN_PA20 / SD_D1 / SPI0_MISO / UART2_RTS / I2C0_SDA / PWM0
      - PIN_PA23 / PWM7
