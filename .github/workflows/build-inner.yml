name: "Build ESPHome (single)"

on:
  workflow_call:
    inputs:
      enabled:
        required: false
        type: boolean
        default: true
      config:
        required: true
        type: string
      esphome-repo:
        required: false
        type: string
      esphome-ref:
        required: false
        type: string

jobs:
  esphome:
    name: Build ESPHome (${{ inputs.config }})
    runs-on: ubuntu-latest
    if: ${{ inputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Checkout ESPHome
        uses: actions/checkout@v3
        with:
          repository: ${{ inputs.esphome-repo || 'esphome/esphome' }}
          ref: ${{ inputs.esphome-ref || 'release' }}
          path: esphome
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ inputs.esphome-repo || 'esphome/esphome' }}

      - name: Install PlatformIO Core
        run: |
          pip install --upgrade platformio
      - name: Install ESPHome
        run: |
          cd esphome/
          pip install -e .

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datever=$(date +'%y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Build firmware binaries
        run: |
          mkdir -p build/
          cd yaml/
          esphome compile kickstart-${{ inputs.config }}.yaml

      - name: Copy firmware binaries
        run: |
          cd yaml/

          config=${{ inputs.config }}
          date=${{ steps.date.outputs.date }}
          outdir=.esphome/build/kickstart-${config}/.pioenvs/kickstart-${config}

          # copy UF2 if available
          if [ -f ${outdir}/firmware.uf2 ]; then
            cp -v ${outdir}/firmware.uf2 ../build/kickstart-${config}-${date}.uf2
          fi

          # copy family-specific outputs
          # ;;& goes through all matching branches, not just the first one
          case $config in
            bk7231t|bk7231n|bk7238)
              cp -v ${outdir}/*.ota.rbl ../build/kickstart-${config}-${date}.ota.rbl
              ;;&
            bk*-tuya)
              cp -v ${outdir}/*.ota.ug.bin ../build/kickstart-${config}-${date}.ota.ug.bin || true
              ;;&

            esp32*)
              outdir=.esphome/build/kickstart-${config}/build
              cp -v ${outdir}/firmware.factory.bin ../build/kickstart-${config}-${date}.factory.bin
              cp -v ${outdir}/firmware.ota.bin ../build/kickstart-${config}-${date}.ota.bin
              ;;&
            esp8266*)
              cp -v ${outdir}/firmware.bin ../build/kickstart-${config}-${date}.firmware.bin
              ;;&

            ln882h*)
              cp -v ${outdir}/image_ota.*.bin ../build/kickstart-${config}-${date}.ota.bin
              ;;&

            rtl8720cf*)
              cp -v ${outdir}/image_firmware_is.*.bin ../build/kickstart-${config}-${date}.app.bin
              ;;&

            bk7231t-tuya)
              cp -v ${outdir}/*.ota.rbl ../build/OpenBK7231T_OTA_upgrade_to_esphome_${date}.rbl
              ;;&
            bk7231n-tuya)
              cp -v ${outdir}/*.ota.rbl ../build/OpenBK7231N_OTA_upgrade_to_esphome_${date}.rbl
              ;;&
            ln882h-tuya)
              cp -v ${outdir}/image_ota.*.bin ../build/OpenLN882H_OTA_upgrade_to_esphome_${date}.bin
              ;;&
            rtl8720cf-tuya)
              cp -v ${outdir}/image_firmware_is.*.bin ../build/OpenRTL87X0C_OTA_upgrade_to_esphome_${date}.img
              ;;&

            *) ;;
          esac

      - name: Add GitHub release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/*.*
          tag_name: v${{ steps.date.outputs.datever }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
